<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0b15">
<title>Nishiy Demon List</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0811;
  --panel: #15101e;
  --line: #342342;
  --text: #f7f1ff;
  --muted: #b7a9c7;
  --accent: #b65cff;
  --accent2: #9d4edd;
  --soft: #21162e;
  --green: #3dd68c;
  --orange: #ff9f43;
  --red: #ff6b6b;
}
* { box-sizing: border-box; }
html { overflow-x: hidden; scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, input, select, textarea { font: inherit; }
button, a { cursor: pointer; }
a { color: #e0c3ff; text-decoration: none; }
a:hover { text-decoration: underline; color: #fff; }

.wrap { max-width: 960px; width: 100%; margin: auto; padding: 0 18px; }

/* Header */
.hero {
  padding: 36px 0 20px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.logo-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 6px;
}
.logo-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 0 18px rgba(255, 40, 40, 0.45), 0 4px 20px rgba(0,0,0,0.4);
  border: 2px solid rgba(255, 60, 60, 0.6);
}
.logo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.brand h1 {
  font-size: clamp(28px, 5.5vw, 40px);
  line-height: 1.1;
  margin: 0;
  font-weight: 850;
  letter-spacing: -1px;
}
.tag {
  color: var(--muted);
  margin-top: 6px;
  font-size: 14px;
}
.nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 20px;
}
.nav button, .btn, .select {
  border: 1px solid #45464c;
  border-radius: 9px;
  background: var(--soft);
  color: var(--text);
  padding: 9px 15px;
  font-weight: 650;
  transition: background .15s, border-color .15s, transform .1s;
}
.nav button.active, .btn.primary {
  background: linear-gradient(135deg, #a94cff, #7b2cbf);
  border-color: #c27aff;
  color: #fff;
}
.nav button:hover, .btn:hover {
  border-color: #a8a8ad;
  transform: translateY(-1px);
}

/* Main */
main { padding: 12px 0 48px; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 10px 0 16px;
}
.section-head h2 {
  font-size: 22px;
  margin: 0;
  font-weight: 800;
}
.muted { color: var(--muted); font-size: 13px; }

.toolbar {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.search {
  flex: 1;
  min-width: 180px;
  background: var(--panel);
  color: white;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 14px;
  outline: none;
}
.search:focus, input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
}
.select {
  background: var(--panel);
  padding: 10px 12px;
}

/* Cards */
.grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.card, .panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 11px;
  overflow: hidden;
}
.level-card {
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .12s;
}
.level-card:hover {
  background: #1c1528;
  border-color: var(--accent2);
  transform: translateY(-1px);
}
.level-cover {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 6.5;
  overflow: hidden;
  background: linear-gradient(135deg, #2a1a3a 0%, #1a1025 100%);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: flex-end;
  padding: 14px 16px;
}
.cover-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
.level-cover.has-img .cover-rank,
.level-cover.has-img .cover-title,
.level-cover.has-img .cover-diff {
  text-shadow: 0 2px 12px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.5);
}
.level-cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 70% 20%, rgba(182,92,255,0.25) 0%, transparent 55%),
              radial-gradient(ellipse at 20% 80%, rgba(157,78,221,0.15) 0%, transparent 50%);
  pointer-events: none;
  z-index: 1;
}
.level-cover::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 55%;
  background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
  pointer-events: none;
  z-index: 1;
}
.level-cover.tier-1 {
  background: linear-gradient(135deg, #3d2a10 0%, #1a1208 50%, #2a1a08 100%);
}
.level-cover.tier-1::before {
  background: radial-gradient(ellipse at 70% 30%, rgba(255,200,60,0.28) 0%, transparent 55%),
              radial-gradient(ellipse at 15% 70%, rgba(255,140,0,0.12) 0%, transparent 50%);
}
.level-cover.tier-2 {
  background: linear-gradient(135deg, #2a1838 0%, #150e20 50%, #1e1230 100%);
}
.level-cover.tier-3 {
  background: linear-gradient(135deg, #1a2238 0%, #0e1420 50%, #121a2a 100%);
}
.level-cover.tier-official {
  background: linear-gradient(135deg, #1a2a28 0%, #0c1614 50%, #12221e 100%);
}
.level-cover.tier-official::before {
  background: radial-gradient(ellipse at 70% 30%, rgba(61,214,140,0.2) 0%, transparent 55%);
}
.cover-rank {
  position: absolute;
  top: 12px;
  left: 14px;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -1px;
  color: rgba(255,255,255,0.22);
  line-height: 1;
  z-index: 2;
}
.cover-rank.gold { color: rgba(255,215,0,0.35); }
.cover-rank.silver { color: rgba(192,192,192,0.3); }
.cover-rank.bronze { color: rgba(205,127,50,0.32); }
.cover-title {
  position: relative;
  z-index: 2;
  font-size: 17px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  max-width: 85%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cover-diff {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 2;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.12);
  color: #e8dfff;
  backdrop-filter: blur(4px);
}
.detail-cover {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 7;
  border-radius: 12px;
  overflow: hidden;
  margin: 14px 0;
  border: 1px solid var(--line);
  display: flex;
  align-items: flex-end;
  padding: 20px 22px;
}
.detail-cover .cover-rank { font-size: 48px; top: 16px; left: 20px; }
.detail-cover .cover-title { font-size: 24px; }
.card-body { padding: 13px 15px; }
.level-line {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.level-number {
  color: #aaaab0;
  font-weight: 800;
  min-width: 32px;
  font-size: 15px;
  padding-top: 2px;
}
.level-info { min-width: 0; flex: 1; }
.level-info h3 {
  font-size: 16px;
  margin: 0 0 3px;
  letter-spacing: 0;
}
.tiny { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.level-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
  flex-wrap: wrap;
}
.difficulty {
  font-size: 10px;
  color: #d0c5e0;
  border: 1px solid #55376f;
  border-radius: 5px;
  padding: 3px 7px;
  white-space: nowrap;
  background: #2a1b39;
}
.mini-btn {
  background: #251833;
  border: 1px solid #494a50;
  border-radius: 7px;
  color: #f1f1f3;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.mini-btn:hover { border-color: #aaaab0; }

/* Players grid */
.player-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 11px;
}
.player-card {
  padding: 16px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.player-card:hover {
  border-color: var(--accent2);
  background: #1c1528;
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg, #3b2353, #6b2d9b);
  color: white;
  display: grid;
  place-items: center;
  font-size: 17px;
  font-weight: 900;
  margin-bottom: 10px;
}
.player-card h3 {
  margin: 0 0 5px;
  font-size: 15px;
  overflow-wrap: anywhere;
}
.player-card p {
  margin: 3px 0;
  color: var(--muted);
  font-size: 12px;
}


/* Built-in local list manager */
.manage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.manage-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.manage-field.full{grid-column:1/-1}
.manage-field label{font-size:13px;color:var(--muted);font-weight:700}
.manage-field input,.manage-field select,.manage-field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card,#15121e);color:var(--text);font:inherit}
.manage-field textarea{min-height:84px;resize:vertical}
.manage-note{font-size:13px;color:var(--muted)}
@media(max-width:600px){.manage-grid{grid-template-columns:1fr}.manage-field.full{grid-column:auto}}

/* Panels & tables */
.panel { padding: 18px; margin-bottom: 14px; }
.panel h3 { margin: 0 0 12px; }
.row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.row > * { flex: 1; min-width: 160px; }
.table-wrap {
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
  min-width: 480px;
}
.table th, .table td {
  text-align: left;
  border-bottom: 1px solid var(--line);
  padding: 10px 8px;
  vertical-align: top;
}
.table th {
  color: #bdbdc3;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .7px;
}
.table tr:last-child td { border-bottom: 0; }
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 5px;
  background: #2a1b39;
  border: 1px solid #55376f;
  font-size: 11px;
  color: #e1e1e4;
}
.notice {
  padding: 12px 14px;
  background: var(--soft);
  border: 1px solid #55376f;
  border-radius: 9px;
  color: #ddd;
  font-size: 13px;
  margin-bottom: 14px;
}
.empty {
  padding: 40px 10px;
  text-align: center;
  color: var(--muted);
  grid-column: 1 / -1;
}
.back { margin-bottom: 14px; }
.footer {
  border-top: 1px solid var(--line);
  padding: 22px 0 30px;
  color: #85858b;
  font-size: 12px;
  text-align: center;
}

/* Rules */
.rules h3 { margin-top: 22px; margin-bottom: 8px; }
.rules ol, .rules ul { padding-left: 20px; }
.rules li { margin: 8px 0; }

/* Socials */
.socials {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.socials a, .socials button {
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--soft);
  color: #eee;
  font-size: 13px;
}

/* Form */
.formgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}
.field label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 5px;
}
.field input, .field textarea, .field select {
  width: 100%;
  background: #111214;
  color: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
}

/* Rank colors */
.rank-1 { color: #ffd700; }
.rank-2 { color: #c0c0c0; }
.rank-3 { color: #cd7f32; }

@media (max-width: 600px) {
  .wrap { padding: 0 12px; }
  .hero { padding-top: 28px; }
  .brand h1 { font-size: 28px; }
  .nav { gap: 6px; }
  .nav button { padding: 8px 11px; font-size: 12px; }
  .card-body { padding: 12px; }
  .player-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 380px) {
  .player-grid { grid-template-columns: 1fr; }
}
</style>

const LOCAL_ADDITIONS_KEY = 'nishiyDemonListLocalAdditions_v1';
let LOCAL_ADDITIONS = [];
try {
  const saved = JSON.parse(localStorage.getItem(LOCAL_ADDITIONS_KEY) || '[]');
  if (Array.isArray(saved)) LOCAL_ADDITIONS = saved;
} catch (_) { LOCAL_ADDITIONS = []; }

function applyLocalAdditions() {
  LOCAL_ADDITIONS.forEach(item => {
    if (!item || !item.level) return;
    let existing = LEVELS.find(l => l.name.toLowerCase() === String(item.level.name || '').toLowerCase());
    if (!existing) {
      const level = {...item.level};
      if (LEVELS.some(l => Number(l.rank) === Number(level.rank))) {
        level.rank = Math.max(0, ...LEVELS.map(l => Number(l.rank) || 0)) + 1;
      }
      level.victors = Array.isArray(level.victors) ? level.victors : [];
      LEVELS.push(level);
      existing = level;
    }
    if (item.player) {
      if (!existing.victors.some(v => String(v).toLowerCase() === String(item.player).toLowerCase())) {
        existing.victors.push(item.player);
      }
      if (item.progress && item.progress !== '100' && item.progress !== '100%') {
        existing.percent = String(item.progress).includes('%') ? String(item.progress) : `${item.progress}%`;
        existing.percentPlayer = item.player;
      }
      if (item.video) existing.recordVideo = item.video;
      if (item.details) existing.recordDetails = item.details;
      if (item.player.toLowerCase() === String(existing.verifier || '').toLowerCase()) {
        existing.verifier = item.player;
      }
      if (!PLAYERS.some(p => String(p).toLowerCase() === item.player.toLowerCase())) PLAYERS.push(item.player);
    }
  });
  LEVELS.sort((a,b) => Number(a.rank) - Number(b.rank));
}
applyLocalAdditions();

    'medium demon': lang === 'ru' ? 'Medium Demon' : 'Medium Demon',
    'hard demon': lang === 'ru' ? 'Hard Demon' : 'Hard Demon',
    'insane demon': lang === 'ru' ? 'Insane Demon' : 'Insane Demon',
    'extreme demon': lang === 'ru' ? 'Extreme Demon' : 'Extreme Demon',
    easy: 'Easy',
    normal: 'Normal',
    hard: 'Hard',
    harder: 'Harder',
    insane: 'Insane',
    auto: 'Auto',
    official: lang === 'ru' ? 'Официальный' : 'Official'
  };
  return map[lower] || d;
}
function flag(name) {
  if (name === 'ARTEMU13') return '🇬🇾';
  return '🇷🇺';
}
function isFullCompletion(level, playerName) {
  // Full beat only — partial progress does NOT count as completion/hardest
  const name = playerName.toLowerCase();
  if (!level.victors.some(v => v.toLowerCase() === name)) return false;
  const isPartial = level.percentPlayer && level.percentPlayer.toLowerCase() === name;
  if (!isPartial) return true;
  // percentPlayer with explicit 100% still counts as full
  const p = String(level.percent || '').trim();
  return p === '100%' || p === '100';
}
// Points by rank (higher on list = more points). Full completions only.
function levelPoints(rank) {
  const r = Number(rank);
  if (r === 1) return 100;
  if (r === 2) return 90;
  if (r === 3) return 82;
  if (r === 4) return 75;
  if (r === 5) return 70;
  if (r <= 10) return 65 - (r - 6) * 3;       // 65,62,59,56,53
  if (r <= 20) return 45 - (r - 11) * 1.5;     // 45 → ~31.5
  if (r <= 35) return 28 - (r - 21) * 0.7;     // 28 → ~18
  if (r <= 50) return 16 - (r - 36) * 0.4;     // 16 → ~10
  if (r <= 65) return 9 - (r - 51) * 0.25;     // 9 → ~5.5
  return Math.max(1, 4 - (r - 66) * 0.3);     // 4 → 1
}
function pointsForLevel(level, playerName) {
  if (!isFullCompletion(level, playerName)) return 0;
  let pts = levelPoints(level.rank);
  // Verifier bonus +10%
  const isVer = level.verifier && level.verifier.toLowerCase() === String(playerName).toLowerCase();
  if (isVer) pts = pts * 1.1;
  return Math.round(pts * 10) / 10; // 1 decimal
}
function playerStats(name) {
  const done = LEVELS.filter(l => isFullCompletion(l, name));
  const hardest = done.length ? Math.min(...done.map(l => l.rank)) : 999;
  const points = done.reduce((sum, l) => sum + pointsForLevel(l, name), 0);
  return { count: done.length, hardest, points: Math.round(points * 10) / 10 };
}
function rankedPlayers() {
  // Fixed order from the official player list (Top 1 = first in PLAYERS)
  return PLAYERS.map((name, i) => ({
    name,
    top: i + 1,
    ...playerStats(name)
  }));
}
function playerTop(name) {
  const idx = PLAYERS.findIndex(p => p.toLowerCase() === name.toLowerCase());
  return idx >= 0 ? idx + 1 : null;
}

/* ===================== BIND ===================== */
function bind() {
  const manageForm = document.getElementById('manageForm');
  if (manageForm) {
    manageForm.onsubmit = e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(manageForm).entries());
      const progress = Number(data.progress || 100);
      const notice = document.getElementById('manageNotice');
      if (!data.player.trim() || !data.level.trim() || !Number.isFinite(progress) || progress < 0 || progress > 100) {
        if (notice) notice.textContent = lang === 'ru' ? 'Проверь имя игрока, уровень и прогресс от 0 до 100.' : 'Check the player, level, and progress from 0 to 100.';
        return;
      }
      const existing = LEVELS.find(l => l.name.toLowerCase() === data.level.trim().toLowerCase());
      let rank = existing ? existing.rank : (data.rank ? Number(data.rank) : Math.max(0, ...LEVELS.map(l => Number(l.rank) || 0)) + 1);
      if (!existing && (!Number.isInteger(rank) || rank < 1 || LEVELS.some(l => Number(l.rank) === rank))) {
        rank = Math.max(0, ...LEVELS.map(l => Number(l.rank) || 0)) + 1;
      }
      const level = existing ? {...existing, victors:[...existing.victors]} : {
        rank, name:data.level.trim(), difficulty:data.difficulty || 'Demon',
        victors:[], percent:'', percentPlayer:'', creator:data.creator.trim(),
        id:data.id.trim(), verifier:data.verifier.trim() || data.player.trim()
      };
      if (!level.victors.some(v => v.toLowerCase() === data.player.trim().toLowerCase())) level.victors.push(data.player.trim());
      if (progress < 100) { level.percent = `${progress}%`; level.percentPlayer = data.player.trim(); }
      const addition = {
        player:data.player.trim(),
        level:{
          rank:level.rank, name:level.name, difficulty:level.difficulty,
          victors:level.victors, percent:level.percent || '', percentPlayer:level.percentPlayer || '',
          creator:level.creator || data.creator.trim(), id:level.id || data.id.trim(),
          verifier:level.verifier || data.verifier.trim() || data.player.trim()
        },
        progress:String(progress),
        video:data.video.trim(),
        details:data.details.trim(),
        savedAt:new Date().toISOString()
      };
      if (existing) {
        // Keep the current level metadata and only store the new player/progress as an addition.
        addition.level = {rank:existing.rank,name:existing.name,difficulty:existing.difficulty,
          victors:existing.victors,percent:existing.percent,percentPlayer:existing.percentPlayer,
          creator:existing.creator,id:existing.id,verifier:existing.verifier};
      }
      LOCAL_ADDITIONS.push(addition);
      try { localStorage.setItem(LOCAL_ADDITIONS_KEY, JSON.stringify(LOCAL_ADDITIONS)); }
      catch (_) { LOCAL_ADDITIONS.pop(); if (notice) notice.textContent = lang === 'ru' ? 'Не удалось сохранить запись в браузере.' : 'Could not save this entry in the browser.'; return; }
      location.reload();
    };
    const exportBtn = document.getElementById('manageExport');
    if (exportBtn) exportBtn.onclick = () => {
      const blob = new Blob([JSON.stringify(LOCAL_ADDITIONS,null,2)], {type:'application/json;charset=utf-8'});
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href=url; a.download='nishiy-demon-list-additions.json'; a.click(); URL.revokeObjectURL(url);
    };
    const resetBtn = document.getElementById('manageReset');
    if (resetBtn) resetBtn.onclick = () => {};
  }
  document.querySelectorAll('[data-remove-local]').forEach(btn => {
    btn.onclick = () => {
      const index = Number(btn.dataset.removeLocal);
      if (!Number.isInteger(index) || index < 0 || index >= LOCAL_ADDITIONS.length) return;
      if (!confirm(lang === 'ru' ? 'Удалить это добавление? Перезагрузить сайт?' : 'Remove this entry and reload the site?')) return;
      LOCAL_ADDITIONS.splice(index,1);
      localStorage.setItem(LOCAL_ADDITIONS_KEY, JSON.stringify(LOCAL_ADDITIONS));
      location.reload();
    };
  });
  const requestForm = document.getElementById('requestForm');
  if (requestForm) {
    requestForm.onsubmit = e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(requestForm).entries());
      const notice = document.getElementById('requestNotice');
      const list = document.getElementById('requestList');
      if (notice) notice.textContent = lang === 'ru'
        ? 'Форма работает в режиме предпросмотра. Для отправки всем пользователям и одобрения администратором нужно подключить общую базу данных.'
        : 'Preview only: a shared database is required for submissions visible to everyone and administrator approval.';
      if (list) list.innerHTML = '<p><strong>' + (lang === 'ru' ? 'Локальный предпросмотр (не опубликовано): ' : 'Local preview (not published): ') +
        [data.type, data.level, data.player, data.id, data.details, data.proof].filter(Boolean).map(escapeHtml).join(' · ') + '</p>';
    };
  }
  document.querySelectorAll('[data-page]').forEach(b => {
    b.onclick = () => {
      page = b.dataset.page;
      selected = null;
      search = '';
      render();
    };
  });

  const langBtn = document.getElementById('langToggle');
  if (langBtn) {
    langBtn.onclick = () => {
      lang = lang === 'en' ? 'ru' : 'en';
      render();
    };
  }

  const ls = document.getElementById('levelSearch');
  if (ls) {
    ls.oninput = () => {
      search = ls.value;
      const pos = ls.selectionStart;
      render();
      const x = document.getElementById('levelSearch');
      if (x) {
        x.focus();
        x.setSelectionRange(pos, pos);
      }
    };
    const lf = document.getElementById('levelFilter');
    if (lf) {
      lf.value = filter;
      lf.onchange = e => {
        filter = e.target.value;
        render();
      };
    }
  }

  const ps = document.getElementById('playerSearch');
  if (ps) {
    ps.oninput = () => {
      const q = ps.value;
      document.getElementById('main').innerHTML = renderPlayersWithQuery(q);
      bind();
    };
  }

  document.querySelectorAll('[data-open-level]').forEach(b => {
    b.onclick = e => {
      e.preventDefault();
      e.stopPropagation();
      selected = b.dataset.openLevel;
      page = 'level';
      render();
    };
  });

  document.querySelectorAll('[data-level]').forEach(c => {
    c.onclick = e => {
      if (e.target.closest('a,button')) return;
      selected = c.dataset.level;
      page = 'level';
      render();
    };
  });

  document.querySelectorAll('[data-shitty]').forEach(c => {
    const openShitty = e => {
      if (e && e.target.closest('a,button')) return;
      selected = c.dataset.shitty;
      page = 'shitty-detail';
      render();
    };
    c.onclick = openShitty;
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openShitty(e); } };
  });

  document.querySelectorAll('[data-player]').forEach(c => {
    c.onclick = e => {
      e.preventDefault();
      selected = c.dataset.player;
      page = 'player';
      render();
    };
  });
}

function init(){try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);syncCloudData();onAuthStateChanged(auth,u=>{user=u;isAdmin=!!u&&ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((u.email||'').toLowerCase());document.getElementById('cloudLogin').textContent=isAdmin?'Админ · '+(u.displayName||u.email):u?'Выйти':'Войти админом';status.textContent=u?(isAdmin?'Вы вошли как администратор.':'Вход выполнен; доступны реквесты.'):'Можно отправить реквест без входа.';if(panel.style.display==='block'&&isAdmin)renderAdmin();});}catch(e){status.textContent='Firebase не настроен. Заполни firebaseConfig и ADMIN_EMAILS в HTML.'}}
function renderSubmit(){status.textContent='Реквесты видны всем администраторам после отправки.';content.innerHTML=`<form id="cloudRequest" class="cloud-box"><select name="type"><option value="record">Добавить прохождение</option><option value="level">Добавить уровень</option><option value="edit">Исправить данные</option></select><input name="player" required maxlength="50" placeholder="Твой ник в Geometry Dash"><input name="level" required maxlength="100" placeholder="Название уровня"><div class="cloud-row"><input name="progress" type="number" min="0" max="100" placeholder="% прогресса"><input name="id" maxlength="30" placeholder="ID уровня"></div><input name="creator" maxlength="80" placeholder="Создатель уровня"><input name="proof" type="url" maxlength="500" placeholder="Ссылка на видео / доказательство"><textarea name="details" maxlength="500" placeholder="Дополнительная информация (необязательно)"></textarea><button type="submit">Отправить реквест</button><div class="cloud-small">Не указывай пароль или личные данные. Отправка не гарантирует одобрения.</div></form>`;
 document.getElementById('cloudRequest').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),data=Object.fromEntries(f.entries());if(!configured||!db){status.textContent='Облачная база пока не подключена. Настрой Firebase по README.';return;}try{await addDoc(collection(db,'requests'),{...data,status:'pending',createdAt:serverTimestamp()});status.textContent='Реквест отправлен на проверку!';content.innerHTML='';}catch(err){status.textContent='Не удалось отправить: '+err.message}}}
async function renderAdmin(){if(!isAdmin||!db){content.innerHTML='';return;}status.textContent='Панель администратора · реквесты и управление местами';content.innerHTML=`<div class="cloud-row"><button id="cloudAddLevel">＋ Уровень</button><button id="cloudImportLevels">Импортировать исходный лист</button><button id="cloudReload">Обновить</button><button id="cloudLogout">Выйти</button></div><div id="cloudAddForm"></div><h4>Ожидают проверки</h4><div id="cloudQueue">Загрузка…</div><h4>Изменение мест</h4><div id="cloudRanks">Загрузка…</div>`;
 document.getElementById('cloudLogout').onclick=()=>signOut(auth);document.getElementById('cloudReload').onclick=renderAdmin;document.getElementById('cloudImportLevels').onclick=async()=>{if(!confirm('Импортировать все уровни текущего HTML в общую базу? Это позволит менять их места для всех посетителей.'))return;try{const appData=window.NISHI_APP;for(const l of appData.LEVELS){const key='base-'+String(l.rank)+'-'+String(l.name).toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40);await setDoc(doc(db,'levels',key),{rank:Number(l.rank)||99999,name:l.name,id:l.id||'',creator:l.creator||'',difficulty:l.difficulty||'Demon',victors:l.victors||[],percent:l.percent||'',percentPlayer:l.percentPlayer||'',importedFromHtml:true,updatedAt:serverTimestamp()},{merge:true})}await syncCloudData();status.textContent='Исходный лист импортирован в общую базу.';renderAdmin()}catch(e){status.textContent='Ошибка импорта: '+e.message}};document.getElementById('cloudAddLevel').onclick=()=>{const el=document.getElementById('cloudAddForm');el.innerHTML=`<form id="cloudNewLevel" class="cloud-box"><input name="name" required placeholder="Название уровня"><div class="cloud-row"><input name="rank" type="number" min="1" placeholder="Место"><input name="id" placeholder="ID уровня"></div><input name="creator" placeholder="Создатель"><input name="difficulty" placeholder="Сложность, например Extreme Demon"><button>Добавить в лист</button></form>`;document.getElementById('cloudNewLevel').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const rank=Number(d.rank)||Math.max(0,...(window.NISHI_APP?.LEVELS||[]).map(l=>Number(l.rank)||0))+1;try{await setDoc(doc(db,'levels',String(rank)),{...d,rank,updatedAt:serverTimestamp()});await syncCloudData();status.textContent='Уровень добавлен и синхронизирован.';renderAdmin()}catch(err){status.textContent='Ошибка: '+err.message}}};
 try{const snap=await getDocs(query(collection(db,'requests'),orderBy('createdAt','desc')));const reqs=snap.docs.map(d=>({id:d.id,...d.data()}));const queue=document.getElementById('cloudQueue');const pending=reqs.filter(r=>r.status==='pending');queue.innerHTML=pending.length?pending.map(r=>`<div class="cloud-item"><b>${esc(r.type)} · ${esc(r.level)}</b><div class="cloud-small">${esc(r.player)} · ${esc(r.progress||'—')}% · ID ${esc(r.id||'—')}</div>${r.proof?`<a href="${esc(r.proof)}" target="_blank" rel="noopener">Открыть доказательство ↗</a>`:''}<div>${esc(r.details||'')}</div><button data-approve="${esc(r.id)}">Одобрить</button><button data-reject="${esc(r.id)}">Отклонить</button></div>`).join(''):'Нет ожидающих реквестов.';
 queue.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{const r=reqs.find(x=>x.id===b.dataset.approve);try{await updateDoc(doc(db,'requests',r.id),{status:'approved',reviewedBy:user.email,reviewedAt:serverTimestamp()});if(r.type==='level'){const ranks=await getDocs(collection(db,'levels'));const rank=Number(r.id)||ranks.size+1;await setDoc(doc(db,'levels',String(rank)),{name:r.level,rank,id:r.id||'',creator:r.creator||'',difficulty:'Demon',updatedAt:serverTimestamp()})}else{await addDoc(collection(db,'approvedRecords'),{...r,approvedAt:serverTimestamp(),approvedBy:user.email})}await syncCloudData();renderAdmin()}catch(e){status.textContent='Не удалось одобрить: '+e.message}});
 queue.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,'requests',b.dataset.reject),{status:'rejected',reviewedBy:user.email,reviewedAt:serverTimestamp()});renderAdmin()}catch(e){status.textContent=e.message}});
 const rankBox=document.getElementById('cloudRanks');const lsnap=await getDocs(collection(db,'levels'));const cloudLevels=lsnap.docs.map(d=>({key:d.id,...d.data()})).sort((a,b)=>(Number(a.rank)||99999)-(Number(b.rank)||99999));rankBox.innerHTML=cloudLevels.length?cloudLevels.map((l,i)=>`<div class="cloud-item"><b>#${esc(l.rank)} ${esc(l.name)}</b><div class="cloud-row"><button data-move="up" data-key="${esc(l.key)}" ${i===0?'disabled':''}>↑</button><button data-move="down" data-key="${esc(l.key)}" ${i===cloudLevels.length-1?'disabled':''}>↓</button><button data-del="${esc(l.key)}">Удалить</button></div></div>`).join(''):'Уровни, созданные через облачную панель, появятся здесь.';
 rankBox.querySelectorAll('[data-move]').forEach(b=>b.onclick=async()=>{const i=cloudLevels.findIndex(x=>x.key===b.dataset.key),j=i+(b.dataset.move==='up'?-1:1);if(j<0||j>=cloudLevels.length)return;const a=cloudLevels[i],z=cloudLevels[j];await updateDoc(doc(db,'levels',a.key),{rank:Number(z.rank)});await updateDoc(doc(db,'levels',z.key),{rank:Number(a.rank)});renderAdmin()});rankBox.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Удалить уровень из облачного списка?')){await deleteDoc(doc(db,'levels',b.dataset.del));renderAdmin()}});
 }catch(e){status.textContent='Не удалось загрузить очередь. Проверь Firestore Rules: '+e.message}}
if(configured)init();else status.textContent='Firebase ещё не настроен. Реквесты и админ-панель начнут работать после настройки проекта (инструкция в README).';
</script>

</body>
</html>
