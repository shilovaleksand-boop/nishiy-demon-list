<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0b15">
<title>Nishiy Demon List</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0811;
  --panel: #15101e;
  --line: #342342;
  --text: #f7f1ff;
  --muted: #b7a9c7;
  --accent: #b65cff;
  --accent2: #9d4edd;
  --soft: #21162e;
  --green: #3dd68c;
  --orange: #ff9f43;
  --red: #ff6b6b;
}
* { box-sizing: border-box; }
html { overflow-x: hidden; scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, input, select, textarea { font: inherit; }
button, a { cursor: pointer; }
a { color: #e0c3ff; text-decoration: none; }
a:hover { text-decoration: underline; color: #fff; }

.wrap { max-width: 960px; width: 100%; margin: auto; padding: 0 18px; }

/* Header */
.hero {
  padding: 36px 0 20px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.logo-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 6px;
}
.logo-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 0 18px rgba(255, 40, 40, 0.45), 0 4px 20px rgba(0,0,0,0.4);
  border: 2px solid rgba(255, 60, 60, 0.6);
}
.logo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.brand h1 {
  font-size: clamp(28px, 5.5vw, 40px);
  line-height: 1.1;
  margin: 0;
  font-weight: 850;
  letter-spacing: -1px;
}
.tag {
  color: var(--muted);
  margin-top: 6px;
  font-size: 14px;
}
.nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 20px;
}
.nav button, .btn, .select {
  border: 1px solid #45464c;
  border-radius: 9px;
  background: var(--soft);
  color: var(--text);
  padding: 9px 15px;
  font-weight: 650;
  transition: background .15s, border-color .15s, transform .1s;
}
.nav button.active, .btn.primary {
  background: linear-gradient(135deg, #a94cff, #7b2cbf);
  border-color: #c27aff;
  color: #fff;
}
.nav button:hover, .btn:hover {
  border-color: #a8a8ad;
  transform: translateY(-1px);
}

/* Main */
main { padding: 12px 0 48px; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 10px 0 16px;
}
.section-head h2 {
  font-size: 22px;
  margin: 0;
  font-weight: 800;
}
.muted { color: var(--muted); font-size: 13px; }

.toolbar {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.search {
  flex: 1;
  min-width: 180px;
  background: var(--panel);
  color: white;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 14px;
  outline: none;
}
.search:focus, input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
}
.select {
  background: var(--panel);
  padding: 10px 12px;
}

/* Cards */
.grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.card, .panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 11px;
  overflow: hidden;
}
.level-card {
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .12s;
}
.level-card:hover {
  background: #1c1528;
  border-color: var(--accent2);
  transform: translateY(-1px);
}
.level-cover {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 6.5;
  overflow: hidden;
  background: linear-gradient(135deg, #2a1a3a 0%, #1a1025 100%);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: flex-end;
  padding: 14px 16px;
}
.cover-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
.level-cover.has-img .cover-rank,
.level-cover.has-img .cover-title,
.level-cover.has-img .cover-diff {
  text-shadow: 0 2px 12px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.5);
}
.level-cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 70% 20%, rgba(182,92,255,0.25) 0%, transparent 55%),
              radial-gradient(ellipse at 20% 80%, rgba(157,78,221,0.15) 0%, transparent 50%);
  pointer-events: none;
  z-index: 1;
}
.level-cover::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 55%;
  background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
  pointer-events: none;
  z-index: 1;
}
.level-cover.tier-1 {
  background: linear-gradient(135deg, #3d2a10 0%, #1a1208 50%, #2a1a08 100%);
}
.level-cover.tier-1::before {
  background: radial-gradient(ellipse at 70% 30%, rgba(255,200,60,0.28) 0%, transparent 55%),
              radial-gradient(ellipse at 15% 70%, rgba(255,140,0,0.12) 0%, transparent 50%);
}
.level-cover.tier-2 {
  background: linear-gradient(135deg, #2a1838 0%, #150e20 50%, #1e1230 100%);
}
.level-cover.tier-3 {
  background: linear-gradient(135deg, #1a2238 0%, #0e1420 50%, #121a2a 100%);
}
.level-cover.tier-official {
  background: linear-gradient(135deg, #1a2a28 0%, #0c1614 50%, #12221e 100%);
}
.level-cover.tier-official::before {
  background: radial-gradient(ellipse at 70% 30%, rgba(61,214,140,0.2) 0%, transparent 55%);
}
.cover-rank {
  position: absolute;
  top: 12px;
  left: 14px;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -1px;
  color: rgba(255,255,255,0.22);
  line-height: 1;
  z-index: 2;
}
.cover-rank.gold { color: rgba(255,215,0,0.35); }
.cover-rank.silver { color: rgba(192,192,192,0.3); }
.cover-rank.bronze { color: rgba(205,127,50,0.32); }
.cover-title {
  position: relative;
  z-index: 2;
  font-size: 17px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  max-width: 85%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cover-diff {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 2;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.12);
  color: #e8dfff;
  backdrop-filter: blur(4px);
}
.detail-cover {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 7;
  border-radius: 12px;
  overflow: hidden;
  margin: 14px 0;
  border: 1px solid var(--line);
  display: flex;
  align-items: flex-end;
  padding: 20px 22px;
}
.detail-cover .cover-rank { font-size: 48px; top: 16px; left: 20px; }
.detail-cover .cover-title { font-size: 24px; }
.card-body { padding: 13px 15px; }
.level-line {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.level-number {
  color: #aaaab0;
  font-weight: 800;
  min-width: 32px;
  font-size: 15px;
  padding-top: 2px;
}
.level-info { min-width: 0; flex: 1; }
.level-info h3 {
  font-size: 16px;
  margin: 0 0 3px;
  letter-spacing: 0;
}
.tiny { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.level-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
  flex-wrap: wrap;
}
.difficulty {
  font-size: 10px;
  color: #d0c5e0;
  border: 1px solid #55376f;
  border-radius: 5px;
  padding: 3px 7px;
  white-space: nowrap;
  background: #2a1b39;
}
.mini-btn {
  background: #251833;
  border: 1px solid #494a50;
  border-radius: 7px;
  color: #f1f1f3;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.mini-btn:hover { border-color: #aaaab0; }

/* Players grid */
.player-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 11px;
}
.player-card {
  padding: 16px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.player-card:hover {
  border-color: var(--accent2);
  background: #1c1528;
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg, #3b2353, #6b2d9b);
  color: white;
  display: grid;
  place-items: center;
  font-size: 17px;
  font-weight: 900;
  margin-bottom: 10px;
}
.player-card h3 {
  margin: 0 0 5px;
  font-size: 15px;
  overflow-wrap: anywhere;
}
.player-card p {
  margin: 3px 0;
  color: var(--muted);
  font-size: 12px;
}


/* Built-in local list manager */
.manage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.manage-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.manage-field.full{grid-column:1/-1}
.manage-field label{font-size:13px;color:var(--muted);font-weight:700}
.manage-field input,.manage-field select,.manage-field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card,#15121e);color:var(--text);font:inherit}
.manage-field textarea{min-height:84px;resize:vertical}
.manage-note{font-size:13px;color:var(--muted)}
@media(max-width:600px){.manage-grid{grid-template-columns:1fr}.manage-field.full{grid-column:auto}}

/* Panels & tables */
.panel { padding: 18px; margin-bottom: 14px; }
.panel h3 { margin: 0 0 12px; }
.row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.row > * { flex: 1; min-width: 160px; }
.table-wrap {
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
  min-width: 480px;
}
.table th, .table td {
  text-align: left;
  border-bottom: 1px solid var(--line);
  padding: 10px 8px;
  vertical-align: top;
}
.table th {
  color: #bdbdc3;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .7px;
}
.table tr:last-child td { border-bottom: 0; }
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 5px;
  background: #2a1b39;
  border: 1px solid #55376f;
  font-size: 11px;
  color: #e1e1e4;
}
.notice {
  padding: 12px 14px;
  background: var(--soft);
  border: 1px solid #55376f;
  border-radius: 9px;
  color: #ddd;
  font-size: 13px;
  margin-bottom: 14px;
}
.empty {
  padding: 40px 10px;
  text-align: center;
  color: var(--muted);
  grid-column: 1 / -1;
}
.back { margin-bottom: 14px; }
.footer {
  border-top: 1px solid var(--line);
  padding: 22px 0 30px;
  color: #85858b;
  font-size: 12px;
  text-align: center;
}

/* Rules */
.rules h3 { margin-top: 22px; margin-bottom: 8px; }
.rules ol, .rules ul { padding-left: 20px; }
.rules li { margin: 8px 0; }

/* Socials */
.socials {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.socials a, .socials button {
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--soft);
  color: #eee;
  font-size: 13px;
}

/* Form */
.formgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}
.field label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 5px;
}
.field input, .field textarea, .field select {
  width: 100%;
  background: #111214;
  color: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
}

/* Rank colors */
.rank-1 { color: #ffd700; }
.rank-2 { color: #c0c0c0; }
.rank-3 { color: #cd7f32; }

@media (max-width: 600px) {
  .wrap { padding: 0 12px; }
  .hero { padding-top: 28px; }
  .brand h1 { font-size: 28px; }
  .nav { gap: 6px; }
  .nav button { padding: 8px 11px; font-size: 12px; }
  .card-body { padding: 12px; }
  .player-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 380px) {
  .player-grid { grid-template-columns: 1fr; }
}
</style>
